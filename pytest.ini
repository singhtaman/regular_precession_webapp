[pytest]
testpaths = tests
addopts = -ra
markers =
    ui: browser tests (need Playwright and Chromium; skipped otherwise)
filterwarnings =
    ignore::DeprecationWarning
    ignore:Wswiglal-redir-stdio
    # known divide-by-zero / overflow in the model at degenerate orientations
    ignore::RuntimeWarning:regular_precession_no_match
